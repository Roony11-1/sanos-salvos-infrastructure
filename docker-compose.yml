services:
  mascotas-db:
    image: postgres:15
    container_name: mascotas-db
    environment:
      POSTGRES_DB: mascotas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - mascotas-data:/var/lib/postgresql/data
  coincidencias-db:
    image: postgres:15
    container_name: coincidencias-db
    environment:
      POSTGRES_DB: coincidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - coincidencias-data:/var/lib/postgresql/data
  geo-db:
    image: postgis/postgis:15-3.4
    container_name: geo-db
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - geo-data:/var/lib/postgresql/data
  
  # Kafka sin zookeeper aun no lo pruebo!
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # --- KRaft mode (SIN ZOOKEEPER) ---
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # --- Listeners ---
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # --- DEV SETTINGS ---
      - ALLOW_PLAINTEXT_LISTENER=yes
      # reemplaza kafka-setup
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
  mascotas-service:
    build:
      context: ../mascotas-service
    container_name: mascotas-service
    depends_on:
      - mascotas-db
  coincidencias-service:
    build:
      context: ../coincidencias-service
    container_name: coincidencias-service
    depends_on:
      - coincidencias-db
  geo-service:
    build:
      context: ../geo-service
    container_name: geo-service
    depends_on:
      - geo-db
  gateway:
    build:
      context: ../sanos-gateway
    container_name: sanos-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0
    depends_on:
      - coincidencias-service
      - geo-service
      - mascotas-service
  frontend:
    build: ../sanos-salvos-front
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

networks:
  default:
    name: sanos-salvos-network

volumes:
  mascotas-data:
  coincidencias-data:
  geo-data: