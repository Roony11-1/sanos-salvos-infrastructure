services:
  mascotas-db:
    image: postgres:15
    container_name: mascotas-db
    environment:
      POSTGRES_DB: mascotas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5431:5432"
    volumes:
      - mascotas-data:/var/lib/postgresql/data
  coincidencias-db:
    image: postgres:15
    container_name: coincidencias-db
    environment:
      POSTGRES_DB: coincidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5430:5432"
    volumes:
      - coincidencias-data:/var/lib/postgresql/data

  message-db:
    image: mongo:7
    container_name: message-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: messages
    volumes:
      - message-data:/data/db

  users-db:
    image: postgres:15
    container_name: users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - users-data:/var/lib/postgresql/data
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    volumes:
      - ./kafka/server.properties:/etc/kafka/server.properties
    command: >
      bash -c "
        kafka-server-start /etc/kafka/server.properties
      "
      
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    command: bash /init-topics.sh

  mascotas-service:
    build:
      context: ../mascotas-service
    container_name: mascotas-service
    depends_on:
      - mascotas-db
  coincidencias-service:
    build:
      context: ../coincidencias-service
      args:
        RUN_TESTS: "true"
        GENERATE_COVERAGE: "true"
    container_name: coincidencias-service
    depends_on:
      - coincidencias-db
    environment:
      RUN_TESTS: "true"
      GENERATE_COVERAGE: "true"
    ports:
      - "8090:8090"

  notification-service:
    build:
      context: ../notification-service
    container_name: notification-service
    ports:
      - "8082:8082"

  message-service:
    build:
      context: ../message-service
    container_name: message-service
    depends_on:
      - message-db
  user-service:
    build:
      context: ../user-service
    container_name: user-service
    depends_on:
      - users-db
      - keycloak
    environment:
      RUN_TESTS: "true"
      GENERATE_COVERAGE: "true"

  gateway:
    build:
      context: ../sanos-gateway
    container_name: sanos-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0
    depends_on:
      - coincidencias-service
      - mascotas-service
      - notification-service
      - message-service
      - user-service
      - kafka-setup
      - keycloak

  frontend:
      build: ../sanos-salvos-front
      container_name: frontend
      ports:
        - "80:80"
      volumes:
        - ./proxy-web/nginx-custom.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - gateway
        - astro
      networks:
        - default

  astro:
      build: ../sanos-salvos-astro
      container_name: astro-landing
      expose:
        - "80"
      # ports:
      #   - "3000:80"
      networks:
        - default

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
  # ports:
  #   - "8081:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
    networks:
      - default

  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    depends_on:
      - sonarqube-db
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
  jmeter:
    image: justb4/jmeter:latest
    container_name: jmeter
    tty: true
    stdin_open: true
    volumes:
      - ./jmeter:/tests
    depends_on:
      - gateway

networks:
  default:
    name: sanos-salvos-network

volumes:
  mascotas-data:
  coincidencias-data:
  message-data:
  users-data:


  sonarqube-db-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
