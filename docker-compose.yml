services:
  mascotas-db:
    image: postgres:15
    container_name: mascotas-db
    environment:
      POSTGRES_DB: mascotas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5431:5432"
    volumes:
      - mascotas-data:/var/lib/postgresql/data
  coincidencias-db:
    image: postgres:15
    container_name: coincidencias-db
    environment:
      POSTGRES_DB: coincidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5430:5432"
    volumes:
      - coincidencias-data:/var/lib/postgresql/data
  geo-db:
    image: postgis/postgis:15-3.4
    container_name: geo-db
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - geo-data:/var/lib/postgresql/data
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
  kafka-setup-reportes:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [kafka]
    command: >
      kafka-topics --create --if-not-exists --topic reporte-registrado --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

  kafka-setup-matches:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [kafka]
    command: >
      kafka-topics --create --if-not-exists --topic matches-detectados --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanos-salvos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  mascotas-service:
    build:
      context: ../mascotas-service
    container_name: mascotas-service
    depends_on:
      - mascotas-db
  coincidencias-service:
    build:
      context: ../coincidencias-service
    container_name: coincidencias-service
    depends_on:
      - coincidencias-db
  geo-service:
    build:
      context: ../geo-service
    container_name: geo-service
    depends_on:
      - geo-db
  gateway:
    build:
      context: ../sanos-gateway
    container_name: sanos-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0
    depends_on:
      - coincidencias-service
      - geo-service
      - mascotas-service
  frontend:
    build: ../sanos-salvos-front
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

networks:
  default:
    name: sanos-salvos-network

volumes:
  mascotas-data:
  coincidencias-data:
  geo-data: