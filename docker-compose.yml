services:
  mascotas-db:
    image: postgres:15
    container_name: mascotas-db
    environment:
      POSTGRES_DB: mascotas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5431:5432"
    volumes:
      - mascotas-data:/var/lib/postgresql/data
  coincidencias-db:
    image: postgres:15
    container_name: coincidencias-db
    environment:
      POSTGRES_DB: coincidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5430:5432"
    volumes:
      - coincidencias-data:/var/lib/postgresql/data
  geo-db:
    image: postgis/postgis:15-3.4
    container_name: geo-db
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - geo-data:/var/lib/postgresql/data

  message-db:
    image: mongo:7
    container_name: message-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: messages
    volumes:
      - message-data:/data/db

  users-db:
    image: postgres:15
    container_name: users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - users-data:/var/lib/postgresql/data
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    volumes:
      - ./kafka/server.properties:/etc/kafka/server.properties
    command: >
      bash -c "
        kafka-server-start /etc/kafka/server.properties
      "
      
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    command: bash /init-topics.sh

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanos-salvos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  mascotas-service:
    build:
      context: ../mascotas-service
    container_name: mascotas-service
    depends_on:
      - mascotas-db
  coincidencias-service:
    build:
      context: ../coincidencias-service
    container_name: coincidencias-service
    depends_on:
      - coincidencias-db

  notification-service:
    build:
      context: ../notification-service
    container_name: notification-service
    ports:
      - "8082:8082"

  message-service:
    build:
      context: ../message-service
    container_name: message-service
    depends_on:
      - message-db
  geo-service:
    build:
      context: ../geo-service
    container_name: geo-service
    depends_on:
      - geo-db

  user-service:
    build:
      context: ../user-service
    container_name: user-service
    depends_on:
      - user-db
  gateway:
    build:
      context: ../sanos-gateway
    container_name: sanos-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0
    depends_on:
      - coincidencias-service
      - geo-service
      - mascotas-service
      - notification-service
      - message-service
      - user-service
      - kafka-setup
      - kafka-ui
      - keycloak

  frontend:
      build: ../sanos-salvos-front
      container_name: frontend
      ports:
        - "80:80"
      volumes:
        - ./proxy-web/nginx-custom.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - gateway
        - astro
      networks:
        - default

  astro:
      build: ../sanos-salvos-astro
      container_name: astro-landing
      expose:
        - "80"
      # ports:
      #   - "3000:80"
      networks:
        - default

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
  # ports:
  #   - "8081:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
    networks:
      - default

networks:
  default:
    name: sanos-salvos-network

volumes:
  mascotas-data:
  coincidencias-data:
  geo-data:
  message-data:
  users-data: