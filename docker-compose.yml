services:
  mascotas-db:
    image: postgres:15
    container_name: mascotas-db
    environment:
      POSTGRES_DB: mascotas
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - mascotas-data:/var/lib/postgresql/data
  coincidencias-db:
    image: postgres:15
    container_name: coincidencias-db
    environment:
      POSTGRES_DB: coincidencias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - coincidencias-data:/var/lib/postgresql/data
  geo-db:
    image: postgis/postgis:15-3.4
    container_name: geo-db
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - geo-data:/var/lib/postgresql/data
  mascotas-service:
    build:
      context: ../mascotas-service
    container_name: mascotas-service
    depends_on:
      - mascotas-db
  coincidencias-service:
    build:
      context: ../coincidencias-service
    container_name: coincidencias-service
    depends_on:
      - coincidencias-db
  geo-service:
    build:
      context: ../geo-service
    container_name: geo-service
    depends_on:
      - geo-db
  gateway:
    build:
      context: ../sanos-gateway
    container_name: sanos-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0
    depends_on:
      - coincidencias-service
      - geo-service
  frontend:
    build: https://github.com/Roony11-1/sanos-salvos-front.git
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

networks:
  default:
    name: sanos-salvos-network

volumes:
  mascotas-data:
  coincidencias-data:
  geo-data: